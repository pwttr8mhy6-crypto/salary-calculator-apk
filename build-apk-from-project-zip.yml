name: Build salary calculator APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: unzip -o salary_calculator_android_widget_project.zip -d android-source
      - name: Build debug APK
        working-directory: android-source/salary-calculator-android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salary-calculator-apk-with-widget
          path: android-source/salary-calculator-android/app/build/outputs/apk/debug/app-debug.apk
