
name: Build Cyberpunk Salary Calculator

on:
  workflow_dispatch:
  push:
    paths:
      - "*.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          HTML_FILE="$(find . -maxdepth 1 -type f -iname '*.html' -print -quit)"
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: HTML calculator not found"
            exit 1
          fi

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/ru/salary/calculator

          cp "$HTML_FILE" app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CyberSalary"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ru.salary.calculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'ru.salary.calculator'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0D18"
                  android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#15283A"
                  android:pathData="M20,14h68a8,8 0,0 1,8 8v64a8,8 0,0 1,-8 8h-68a8,8 0,0 1,-8 -8v-64a8,8 0,0 1,8 -8z"/>
              <path android:fillColor="#42F5D7"
                  android:pathData="M25,26h58v9h-58z"/>
              <path android:fillColor="#C084FC"
                  android:pathData="M25,43h15v15h-15z M46,43h15v15h-15z M67,43h15v15h-15z"/>
              <path android:fillColor="#FDE047"
                  android:pathData="M25,64h15v15h-15z M46,64h15v15h-15z"/>
              <path android:fillColor="#42F5D7"
                  android:pathData="M67,64h15v15h-15z"/>
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Зарплата // Cyber"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ru/salary/calculator/MainActivity.java <<'EOF'
          package ru.salary.calculator;

          import android.Manifest;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.webkit.*;
          import android.view.*;
          import android.widget.*;
          import java.util.Calendar;

          public class MainActivity extends Activity {
              private static final int REQUEST_NOTIFICATIONS = 44;
              private WebView webView;

              private int dp(float n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable shape(int color, int stroke) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(14));
                  if (stroke != 0) d.setStroke(dp(1), stroke);
                  return d;
              }

              private TextView label(String text, int size, int color) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  v.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  return v;
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(9,13,24));
                  getWindow().setNavigationBarColor(Color.rgb(9,13,24));
                  getWindow().getDecorView().setSystemUiVisibility(0);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(9,13,24));
                  root.setPadding(dp(14), dp(8), dp(14), dp(8));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(14), dp(12), dp(14), dp(12));
                  header.setBackground(shape(Color.rgb(17,27,43), Color.rgb(66,245,215)));

                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);
                  titles.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1));

                  TextView title = label("ЗАРПЛАТА // ОС", 20, Color.rgb(66,245,215));
                  TextView subtitle = label("EXPERIMENTAL PAYROLL SYSTEM", 10, Color.rgb(192,132,252));
                  titles.addView(title);
                  titles.addView(subtitle);
                  header.addView(titles);

                  TextView status = label("● ONLINE", 11, Color.rgb(253,224,71));
                  header.addView(status);
                  root.addView(header);

                  Button reminder = new Button(this);
                  reminder.setText("＋  НАПОМИНАНИЕ О СМЕНЕ");
                  reminder.setAllCaps(false);
                  reminder.setTextColor(Color.rgb(9,13,24));
                  reminder.setTextSize(13);
                  reminder.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  reminder.setBackground(shape(Color.rgb(66,245,215), 0));
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(-1, dp(48));
                  bp.topMargin = dp(10);
                  bp.bottomMargin = dp(10);
                  root.addView(reminder, bp);
                  reminder.setOnClickListener(v -> chooseReminder());

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(9,13,24));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  root.addView(webView, new LinearLayout.LayoutParams(-1, 0, 1));

                  TextView footer = label("LOCAL MODE  •  NO ADS  •  OFFLINE", 10, Color.rgb(66,245,215));
                  footer.setGravity(Gravity.CENTER);
                  footer.setPadding(0, dp(8), 0, dp(5));
                  root.addView(footer);

                  setContentView(root);
                  createChannel();
                  webView.loadUrl("file:///android_asset/index.html");

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS},
                          REQUEST_NOTIFICATIONS);
                  }
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                          "shift_reminders",
                          "Напоминания о сменах",
                          NotificationManager.IMPORTANCE_HIGH);
                      channel.setDescription("Локальные напоминания о рабочих сменах");
                      getSystemService(NotificationManager.class)
                          .createNotificationChannel(channel);
                  }
              }

              private void chooseReminder() {
                  Calendar now = Calendar.getInstance();
                  DatePickerDialog dateDialog = new DatePickerDialog(this,
                      (picker, year, month, day) -> {
                          Calendar selected = Calendar.getInstance();
                          selected.set(year, month, day);
                          new TimePickerDialog(this, (timePicker, hour, minute) -> {
                              selected.set(Calendar.HOUR_OF_DAY, hour);
                              selected.set(Calendar.MINUTE, minute);
                              selected.set(Calendar.SECOND, 0);
                              selected.set(Calendar.MILLISECOND, 0);

                              if (selected.getTimeInMillis() <= System.currentTimeMillis()) {
                                  Toast.makeText(this,
                                      "Выбери будущее время", Toast.LENGTH_LONG).show();
                                  return;
                              }

                              Intent intent = new Intent(this, ReminderReceiver.class);
                              PendingIntent pending = PendingIntent.getBroadcast(
                                  this, (int)(selected.getTimeInMillis() / 60000),
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                              AlarmManager alarm = (AlarmManager)getSystemService(ALARM_SERVICE);
                              alarm.setAndAllowWhileIdle(
                                  AlarmManager.RTC_WAKEUP,
                                  selected.getTimeInMillis(), pending);

                              Toast.makeText(this, "Напоминание о смене запланировано",
                                  Toast.LENGTH_LONG).show();
                          }, now.get(Calendar.HOUR_OF_DAY), now.get(Calendar.MINUTE), true)
                              .show();
                      },
                      now.get(Calendar.YEAR),
                      now.get(Calendar.MONTH),
                      now.get(Calendar.DAY_OF_MONTH));
                  dateDialog.getDatePicker().setMinDate(System.currentTimeMillis());
                  dateDialog.show();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/ru/salary/calculator/ReminderReceiver.java <<'EOF'
          package ru.salary.calculator;

          import android.app.*;
          import android.content.*;
          import android.os.Build;
          import android.Manifest;
          import android.content.pm.PackageManager;

          public class ReminderReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) return;

                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= 26) {
                      builder = new Notification.Builder(context, "shift_reminders");
                  } else {
                      builder = new Notification.Builder(context);
                  }

                  builder.setSmallIcon(R.drawable.ic_launcher)
                      .setContentTitle("Пора на смену")
                      .setContentText("Проверь рабочий график и подготовься к смене.")
                      .setAutoCancel(true)
                      .setCategory(Notification.CATEGORY_REMINDER);

                  NotificationManager manager =
                      (NotificationManager)context.getSystemService(Context.NOTIFICATION_SERVICE);
                  manager.notify(2001, builder.build());
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salary-calculator-cyberpunk-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
